name: ci

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF line endings on Windows so rustfmt and text fixtures match the repository.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Default members = everything except the desktop app (which needs a platform webview SDK).
      - run: cargo clippy --all-targets -- -D warnings
      # Unit + end-to-end tests. E2E uses the in-tree mock engine; no GPU or weights needed.
      - run: cargo test
      # Absolute speed numbers are never CI gates (too noisy); only check the harness runs.

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test apps/desktop/ui/markdown.test.mjs
      - run: cargo clippy -p llmario-desktop -- -D warnings
      # The Windows release build and installer are built and tested in windows.yml.
      - if: runner.os == 'macOS'
        run: cargo build --release -p llmario-desktop

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources
