name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Default members = everything except the desktop app (which needs a platform webview SDK).
      - run: cargo clippy --all-targets -- -D warnings
      # Unit + end-to-end tests. E2E uses the in-tree mock engine; no GPU or weights needed.
      - run: cargo test
      # Absolute speed numbers are never CI gates (too noisy); only check the harness runs.

  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test apps/desktop/ui/markdown.test.mjs
      - run: cargo clippy -p llmario-desktop -- -D warnings
      - run: cargo build --release -p llmario-desktop

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources
