# Curated model library (research input). `scripts/catalog/build.py` verifies every variant against
# the Hugging Face Hub and writes crates/model_registry/catalog.toml with exact files, sizes,
# checksums, license, architecture, context length and shape, pinned to a commit.
#
# Selection criteria (researched 2026-09-29): current open-weight text-generation models from their
# original publishers, sized for laptops and workstations (0.2B–120B), with a GGUF build from a
# reputable converter (ggml-org, the publisher, unsloth, bartowski) and, where one exists, an MLX
# build from mlx-community. Models that need datacenter hardware (DeepSeek V4, GLM-5.x, Qwen3.8
# 2.4T) and experimental quantizations that need forked engines are left out.
#
# Candidate repos are tried in order; the first that exists wins. Variants that cannot be verified
# are dropped from the generated catalog and reported.

