# Built-in catalog of pullable models. Each family has an MLX variant (Apple Silicon) and a
# GGUF variant (llama.cpp, everywhere) so the planner can pick the right execution path and
# `llmario bench` can compare backends on the same base model.
#
# `approx_bytes` is the download size from the Hub listing (shown before downloading).
# Licenses are labels copied from the upstream model cards; they are not legal advice.
# `revision` is the git ref to resolve at pull time; the resolved commit SHA is recorded in
# the local registry so every benchmark names the exact files it ran.
# Note: the MLX (affine 4-bit, group 64) and GGUF Q4_K_M quantizations are different schemes
# of similar size; compare them as "the best 4-bit path per backend", not as identical weights.

[[models]]
id = "qwen3-1.7b-mlx-4bit"
approx_bytes = 984000000
family = "qwen3-1.7b"
format = "mlx"
repo = "mlx-community/Qwen3-1.7B-4bit"
revision = "main"
license = "Apache-2.0"
description = "Qwen3 1.7B, MLX 4-bit. Small, fast, good for smoke tests and laptops."

[[models]]
id = "qwen3-1.7b-gguf-q4km"
approx_bytes = 1107409472
family = "qwen3-1.7b"
format = "gguf"
repo = "unsloth/Qwen3-1.7B-GGUF"
revision = "main"
files = ["Qwen3-1.7B-Q4_K_M.gguf"]
license = "Apache-2.0"
description = "Qwen3 1.7B, GGUF Q4_K_M for llama.cpp."

