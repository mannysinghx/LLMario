[workspace]
resolver = "2"
# Listed explicitly because `crates/*` would also match the `crates/engine` directory, which holds
# the native engine's crates (`crates/engine/*`) and is not a package itself.
members = [
  "crates/core", "crates/hardware", "crates/model_registry", "crates/supervisor",
  "crates/adapter_llamacpp", "crates/adapter_mlx", "crates/adapter_mock", "crates/adapter_native",
  "crates/api", "crates/benchmark", "crates/runtime", "crates/cli",
  "crates/engine/*", "apps/desktop/src-tauri",
]
# The desktop app needs platform webview toolchains; plain `cargo build/test` skips it.
default-members = [
  "crates/core", "crates/hardware", "crates/model_registry", "crates/supervisor",
  "crates/adapter_llamacpp", "crates/adapter_mlx", "crates/adapter_mock", "crates/api",
  "crates/benchmark", "crates/runtime", "crates/cli",
  "crates/adapter_native",
  "crates/engine/core", "crates/engine/formats", "crates/engine/tokenizer", "crates/engine/model",
  "crates/engine/plan", "crates/engine/kv", "crates/engine/cpu", "crates/engine/sched",
  "crates/engine/decode", "crates/engine/chat", "crates/engine/server", "crates/engine/bin",
  "crates/engine/testkit", "crates/engine/metal", "crates/engine/tools",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/your-org/llmario"
rust-version = "1.80"

[workspace.dependencies]
llmario-core = { path = "crates/core" }
llmario-hardware = { path = "crates/hardware" }
llmario-registry = { path = "crates/model_registry" }
llmario-supervisor = { path = "crates/supervisor" }
llmario-adapter-llamacpp = { path = "crates/adapter_llamacpp" }
llmario-adapter-mlx = { path = "crates/adapter_mlx" }
llmario-adapter-mock = { path = "crates/adapter_mock" }
llmario-api = { path = "crates/api" }
llmario-benchmark = { path = "crates/benchmark" }
llmario-runtime = { path = "crates/runtime" }
llmario-adapter-native = { path = "crates/adapter_native" }
llmario-engine-core = { path = "crates/engine/core" }
llmario-engine-formats = { path = "crates/engine/formats" }
llmario-engine-tokenizer = { path = "crates/engine/tokenizer" }
llmario-engine-model = { path = "crates/engine/model" }
llmario-engine-plan = { path = "crates/engine/plan" }
llmario-engine-kv = { path = "crates/engine/kv" }
llmario-engine-cpu = { path = "crates/engine/cpu" }
llmario-engine-sched = { path = "crates/engine/sched" }
llmario-engine-decode = { path = "crates/engine/decode" }
llmario-engine-chat = { path = "crates/engine/chat" }
llmario-engine-server = { path = "crates/engine/server" }
llmario-engine-testkit = { path = "crates/engine/testkit" }
llmario-engine-metal = { path = "crates/engine/metal" }
llmario-engine-tools = { path = "crates/engine/tools" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fancy-regex = "0.19"
futures = "0.3"
half = { version = "2", features = ["std"] }
hex = "0.4"
indicatif = "0.18"
libc = "0.2"
# Constrained decoding (MIT); version verified on crates.io 2026-10-09. rayon feature is FFI-only.
llguidance = { version = "=1.9.1", default-features = false, features = ["lark", "referencing", "ahash"] }
memmap2 = "0.9"
# Metal bindings (Zlib OR Apache-2.0 OR MIT); versions verified on crates.io 2026-10-09.
objc2 = "0.6.5"
objc2-metal = { version = "0.3.2", features = [
  "MTLDevice", "MTLBuffer", "MTLResource", "MTLAllocation", "MTLLibrary", "MTLCommandQueue",
  "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePipeline",
  "MTLResidencySet", "MTLTypes", "MTLHeap",
] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSError", "NSArray", "NSProcessInfo"] }
minijinja = { version = "2", features = ["loader", "json", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Tool crate dependencies (MIT / Apache-2.0 / BSD only); versions verified on crates.io 2026-10-09.
dom_smoothie = "0.18.2"
htmd = "0.5.5"
ipnet = "2.12.2"
jsonschema = { version = "0.58.6", default-features = false }
lru = "0.18.5"
rand = "0.10.3"
rmcp = { version = "3.5.1", default-features = false }
texting_robots = "0.2.2"
url = "2.5.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects",
  "Win32_System_ProcessStatus", "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Proc-macros and build scripts are loaded by the compiler as dylibs. On macOS 27, stripping
# them can produce "mis-aligned LINKEDIT string pool" dlopen failures (E0463 "can't find
# crate for `tokio_macros`"), so only final artifacts are stripped.
[profile.release.build-override]
strip = false
