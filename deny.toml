# cargo-deny policy (https://github.com/EmbarkStudios/cargo-deny): `cargo deny check`
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # "Unmaintained" notice, not a vulnerability. A compile-time proc-macro reached only through
  # Tauri's Linux GTK stack (gtk-rs 0.18 → glib-macros); not in the macOS or Windows builds.
  # cargo-deny reports no safe upgrade; drop this once Tauri moves to a newer gtk-rs.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained compile-time dependency of Tauri's Linux GTK stack; no upgrade available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Every license present in the dependency tree on 2026-09-28 (240 crates), all permissive or
# file-level weak copyleft. Anything new fails CI until reviewed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
