# cargo-deny policy (https://github.com/EmbarkStudios/cargo-deny): `cargo deny check`
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # "Unmaintained" notice, not a vulnerability. A compile-time proc-macro reached only through
  # Tauri's Linux GTK stack (gtk-rs 0.18 → glib-macros); not in the macOS or Windows builds.
  # cargo-deny reports no safe upgrade; drop this once Tauri moves to a newer gtk-rs.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained compile-time dependency of Tauri's Linux GTK stack; no upgrade available" },
  # "Unmaintained" notice, not a vulnerability; every chrono version is listed and cargo-deny
  # reports no safe upgrade. Six workspace crates use chrono for timestamps, and rmcp and schemars
  # depend on it too, so moving our own crates to jiff or time would not clear the notice. This
  # entry covers this advisory only: a vulnerability in chrono gets its own ID and still fails.
  # Drop it once rmcp and schemars no longer pull chrono in and our crates have moved off it, or
  # chrono is maintained again. Owner's decision, 2026-11-17.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained notice for chrono; no upgrade available, and rmcp and schemars depend on it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Every license present in the dependency tree on 2026-09-28 (240 crates), all permissive or
# file-level weak copyleft. Anything new fails CI until reviewed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # MIT No Attribution (OSI-approved; MIT without the notice requirement). Reviewed 2026-10-09:
  # `borrow-or-share`, via `fluent-uri` <- `referencing` <- llguidance (constrained decoding)
  # and jsonschema (tool-argument validation).
  "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
